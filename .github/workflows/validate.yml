name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  changed-apps:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate apps touched by this change
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Changed schema files affect every app, so validate everything in that case.
          if git diff --name-only "$base" HEAD | grep -q '^schema/'; then
            npm run validate
          else
            apps=$(git diff --name-only "$base" HEAD -- apps | awk -F/ 'NF>=5 {print $1"/"$2"/"$3"/"$4}' | sort -u)
            if [ -z "$apps" ]; then echo "No app changes."; exit 0; fi
            node scripts/validate.mjs $apps
          fi
